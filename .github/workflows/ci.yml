name: CI
# Every push runs CI, on any branch, so a unit needs no pull request to be checked.
on:
  push:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - run: python3 design/tools/check.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/backend-release.json') }}
      - run: npm ci
      # Codegen rewrites both compositions' generated files. A changed or a new file fails the job.
      - run: npm run codegen
      - run: git diff --exit-code -- fixture/convex example/convex
      - run: test -z "$(git status --porcelain -- fixture/convex example/convex)"
      - run: npm run test:native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-evidence
          path: evidence/runs/*.json
