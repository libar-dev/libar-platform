name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - run: python3 design/tools/check.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/backend-release.json') }}
      - run: npm ci
      - run: npm run codegen
      - run: git diff --exit-code -- fixture/convex
      - run: npm run test:native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-evidence
          path: evidence/runs/*.json
